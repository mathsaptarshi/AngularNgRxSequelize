<div
  style="
    max-width: 400px;
    margin: 40px auto;
    padding: 24px;
    border: 1px solid #ccc;
    border-radius: 8px;
  "
>
  <h2>Register</h2>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <!-- Name -->
    <div style="margin-bottom: 12px">
      <label for="name">Full Name</label><br />
      <input
        id="name"
        type="text"
        formControlName="name"
        style="width: 100%; padding: 8px; box-sizing: border-box"
        placeholder="John Doe"
      />
      <small
        *ngIf="registerForm.get('name')?.touched && registerForm.get('name')?.invalid"
        style="color: red"
      >
        Name is required (min 2 characters).
      </small>
    </div>

    <!-- Email -->
    <div style="margin-bottom: 12px">
      <label for="email">Email</label><br />
      <input
        id="email"
        type="email"
        formControlName="email"
        style="width: 100%; padding: 8px; box-sizing: border-box"
        placeholder="john@example.com"
      />
      <small
        *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.invalid"
        style="color: red"
      >
        Valid email is required.
      </small>
    </div>

    <!-- Password -->
    <div style="margin-bottom: 12px">
      <label for="password">Password</label><br />
      <input
        id="password"
        type="password"
        formControlName="password"
        style="width: 100%; padding: 8px; box-sizing: border-box"
        placeholder="••••••••"
      />
      <small
        *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid"
        style="color: red"
      >
        Password is required (min 6 characters).
      </small>
    </div>

    <!-- Role Selection -->
    <div style="margin-bottom: 16px">
      <label for="role">Role</label><br />
      <select
        id="role"
        formControlName="role"
        style="width: 100%; padding: 8px; box-sizing: border-box"
      >
        <option value="customer">Customer</option>
        <option value="captain">Captain</option>
        <option value="admin">Admin</option>
      </select>
    </div>

    <!-- Error Message from Store -->
    <div *ngIf="error$ | async as error" style="color: red; margin-bottom: 12px">
      {{ error }}
    </div>

    <!-- Submit Button -->
    <button
      type="submit"
      [disabled]="registerForm.invalid || (loading$ | async)"
      style="width: 100%; padding: 10px; cursor: pointer"
    >
      {{ (loading$ | async) ? 'Registering...' : 'Sign Up' }}
    </button>
  </form>

  <p style="margin-top: 16px; text-align: center">
    Already have an account? <a routerLink="/login">Log in</a>
  </p>
</div>
